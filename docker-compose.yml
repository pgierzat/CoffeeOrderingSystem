version: '3.8'

services:
  db:
    image: postgres:15-alpine
    contianer_name: coffee_postgres_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      POSTGRES_DB:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: